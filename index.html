// 老板键：F9切换代码伪装界面
let bossMode = false;
const bossCode = `// server.js - Enterprise Data Service
const express = require('express');
const mysql = require('mysql2/promise');
const redis = require('redis');
const app = express();

// Database connection pool
const pool = mysql.createPool({
  host: '10.0.1.100',
  user: 'app_svc',
  password: '********',
  database: 'enterprise_db',
  waitForConnections: true,
  connectionLimit: 20,
  queueLimit: 0
});

// Redis client for caching
const redisClient = redis.createClient({
  url: 'redis://10.0.1.101:6379',
  password: '********'
});
redisClient.connect().catch(console.error);

// Middleware
app.use(express.json({ limit: '10mb' }));
app.use(cors({ origin: process.env.ALLOWED_ORIGINS.split(',') }));
app.use(helmet());
app.use(compression());

// Auth middleware
const authenticate = async (req, res, next) => {
  const token = req.headers.authorization?.replace('Bearer ', '');
  if (!token) return res.status(401).json({ error: 'Unauthorized' });
  try {
    const decoded = jwt.verify(token, process.env.JWT_SECRET);
    req.user = decoded;
    const cached = await redisClient.get(\`session:\${decoded.userId}\`);
    if (!cached) return res.status(401).json({ error: 'Session expired' });
    next();
  } catch (e) { return res.status(401).json({ error: 'Invalid token' }); }
};

// API Routes
app.get('/api/v1/records', authenticate, async (req, res) => {
  const { page = 1, limit = 50, status, type } = req.query;
  const offset = (page - 1) * limit;
  let query = 'SELECT * FROM records WHERE 1=1';
  const params = [];
  if (status) { query += ' AND status = ?'; params.push(status); }
  if (type) { query += ' AND type = ?'; params.push(type); }
  query += ' ORDER BY created_at DESC LIMIT ? OFFSET ?';
  params.push(parseInt(limit), offset);
  const [rows] = await pool.execute(query, params);
  const [countResult] = await pool.execute('SELECT COUNT(*) as total FROM records');
  res.json({ data: rows, total: countResult[0].total, page: parseInt(page) });
});

app.post('/api/v1/records', authenticate, async (req, res) => {
  const { title, content, type, priority } = req.body;
  if (!title || !content) return res.status(400).json({ error: 'Missing required fields' });
  const [result] = await pool.execute(
    'INSERT INTO records (title, content, type, priority, created_by) VALUES (?, ?, ?, ?, ?)',
    [title, content, type || 'normal', priority || 'medium', req.user.userId]
  );
  await redisClient.del('records:list');
  res.status(201).json({ id: result.insertId, message: 'Created successfully' });
});

app.put('/api/v1/records/:id', authenticate, async (req, res) => {
  const { id } = req.params;
  const updates = [];
  const params = [];
  for (const [key, value] of Object.entries(req.body)) {
    if (['title', 'content', 'status', 'priority'].includes(key)) {
      updates.push(\`\${key} = ?\`);
      params.push(value);
    }
  }
  if (updates.length === 0) return res.status(400).json({ error: 'No valid fields to update' });
  params.push(id);
  await pool.execute(\`UPDATE records SET \${updates.join(', ')} WHERE id = ?\`, params);
  await redisClient.del(\`record:\${id}\`);
  res.json({ message: 'Updated successfully' });
});

app.delete('/api/v1/records/:id', authenticate, async (req, res) => {
  const { id } = req.params;
  await pool.execute('UPDATE records SET deleted_at = NOW() WHERE id = ?', [id]);
  await redisClient.del(\`record:\${id}\`, 'records:list');
  res.json({ message: 'Deleted successfully' });
});

// Health check
app.get('/health', async (req, res) => {
  const dbStatus = await pool.query('SELECT 1').then(() => 'up').catch(() => 'down');
  const redisStatus = redisClient.isOpen ? 'up' : 'down';
  res.json({ status: 'ok', database: dbStatus, redis: redisStatus, uptime: process.uptime() });
});

// Error handler
app.use((err, req, res, next) => {
  console.error('Unhandled error:', err);
  res.status(500).json({ error: 'Internal server error', reference: Date.now() });
});

const PORT = process.env.PORT || 3000;
app.listen(PORT, () => {
  console.log(\`[Server] Enterprise Data Service running on port \${PORT}\`);
  console.log(\`[Server] Environment: \${process.env.NODE_ENV}\`);
  console.log(\`[Server] Database pool initialized with 20 connections\`);
});`;

function toggleBossMode() {
  bossMode = !bossMode;
  let overlay = document.getElementById('bossOverlay');
  if (bossMode) {
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'bossOverlay';
      overlay.className = 'boss-overlay';
      overlay.innerHTML = `
        <div class="boss-titlebar">
          <div class="boss-tabs">
            <span class="boss-tab active">server.js</span>
            <span class="boss-tab">config.js</span>
            <span class="boss-tab">package.json</span>
            <span class="boss-tab">README.md</span>
          </div>
          <div class="boss-window-controls">
            <span class="boss-dot" style="background:#ff5f57"></span>
            <span class="boss-dot" style="background:#febc2e"></span>
            <span class="boss-dot" style="background:#28c840"></span>
          </div>
        </div>
        <div class="boss-codearea">
          <div class="boss-linenos"></div>
          <pre class="boss-code"></pre>
        </div>
        <div class="boss-statusbar">
          <span>UTF-8</span><span>JavaScript</span><span>Ln 1, Col 1</span><span>Spaces: 2</span><span style="margin-left:auto">~ to exit</span>
        </div>
      `;
      document.body.appendChild(overlay);
      const codeEl = overlay.querySelector('.boss-code');
      const lineNos = overlay.querySelector('.boss-linenos');
      const lines = bossCode.split('\n');
      codeEl.textContent = bossCode;
      lineNos.innerHTML = lines.map((_, i) => `<div>${i+1}</div>`).join('');
    }
    overlay.style.display = 'flex';
  } else {
    if (overlay) overlay.style.display = 'none';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === '`' || e.key === '~') { e.preventDefault(); toggleBossMode(); }
});
